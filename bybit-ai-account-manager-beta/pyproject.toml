[project]
name = "bybit-ai-account-manager-beta"
version = "4.6.9"
description = "Experimental AI-assisted Bybit account management desktop application"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.18.3,<1.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0,<3.0",
  "PySide6>=6.8,<7.0",
  "Markdown>=3.6,<4.0",
  "playwright>=1.48,<2.0",
]

[project.scripts]
bybit-ai-manager = "main:main"
